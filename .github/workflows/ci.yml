name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:6-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Confirm real database contract ran
        run: |
          report="target/surefire-reports/TEST-com.aggregation.service.integration.RealDatabasesIntegrationTest.xml"
          test -f "$report"
          grep -q 'tests="1"' "$report"
          grep -q 'errors="0"' "$report"
          grep -q 'skipped="0"' "$report"
          grep -q 'failures="0"' "$report"

      - name: Build Docker image
        run: docker build --tag user-aggregation-service:ci .
