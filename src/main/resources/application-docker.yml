data-sources:
  sources:
    - name: postgres-primary
      type: jdbc
      strategy: postgres
      url: ${AGGREGATION_PRIMARY_JDBC_URL}
      table: users
      username: ${AGGREGATION_PRIMARY_JDBC_USERNAME}
      password: ${AGGREGATION_PRIMARY_JDBC_PASSWORD}
      primary: true
      priority: 100
      mapping:
        id: id
        username: username
        name: first_name
        surname: last_name

    - name: mongodb-secondary
      type: mongodb
      url: ${AGGREGATION_MONGODB_URI}
      priority: 90

spring:
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.aggregation.service: DEBUG
    org.springframework.data: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.data.jpa: DEBUG
    org.springframework.boot.actuate: DEBUG
