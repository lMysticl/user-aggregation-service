spring:
  application:
    name: user-aggregation-service
  datasource:
    url: ${AGGREGATION_PRIMARY_JDBC_URL:jdbc:h2:mem:users;DB_CLOSE_DELAY=-1}
    username: ${AGGREGATION_PRIMARY_JDBC_USERNAME:sa}
    password: ${AGGREGATION_PRIMARY_JDBC_PASSWORD:}
  data:
    mongodb:
      uri: ${AGGREGATION_MONGODB_URI:mongodb://localhost:27017/users}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

aggregation:
  query-timeout: ${AGGREGATION_QUERY_TIMEOUT:2s}
  demo-data:
    enabled: false
  executor:
    core-pool-size: ${AGGREGATION_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${AGGREGATION_EXECUTOR_MAX_POOL_SIZE:8}
    queue-capacity: ${AGGREGATION_EXECUTOR_QUEUE_CAPACITY:100}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.aggregation.service: INFO
    org.springframework.data: INFO
    org.hibernate: INFO
